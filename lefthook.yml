pre-commit:
  parallel: true
  commands:
    frontend-tests:
      run: pnpm test
    rust-tests:
      run: cd src-tauri && cargo test
    sidecar-tests:
      run: .sidecar-venv/bin/python -m pytest src-tauri/sidecar/test_tts.py src-tauri/sidecar/test_chunked_tts.py -q
    typecheck:
      run: pnpm check

pre-push:
  parallel: true
  commands:
    clippy:
      run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
    audit-npm:
      run: pnpm audit --audit-level=high || true
    audit-rust:
      run: cargo audit --file src-tauri/Cargo.lock 2>/dev/null || true
