[package]
name = "voiceover"
version = "0.1.0"
description = "Screen recorder with ElevenLabs voice replacement"
authors = ["dave"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
# Exclude the Python sidecar from cargo's file watcher so __pycache__
# writes don't trigger tauri dev to rebuild+restart the app.
exclude = ["sidecar/"]

[lib]
name = "voiceover_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
reqwest = { version = "0.12", features = ["multipart", "json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync", "fs"] }
dirs = "6"
tauri-plugin-global-shortcut = "2"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
url = "2"
open = "5"
keyring = { version = "3", features = ["apple-native", "linux-native"] }

[dev-dependencies]
filetime = "0.2"
