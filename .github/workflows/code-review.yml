# The review tool is in .code-review/; refresh it by running the installer again, never by hand.
name: Code review

on:
  pull_request:
    # `edited` only to re-review after the base branch changes (see the job's condition).
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # A title or body edit gets its own group so it cannot cancel a running review; a push or a
  # base change shares the pull request's group and replaces the stale run.
  group: code-review-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts wait; forks and Dependabot get no secrets, so they are skipped. Dependabot is
    # known by the PR's author, not the actor (a maintainer reopening its PR is the actor).
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR head, not GitHub's merge commit: the reviewers read the code being submitted.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # The agents can read the checkout; the job token must not sit in .git/config.
          persist-credentials: false
      # Secrets reach this PR's own copy of the action by design: GitHub gives same-repository
      # branches secrets because their authors already have write access, and such an author can
      # add any workflow that reads any secret. Forks and Dependabot get none (see `if:` above).
      - uses: ./.code-review
        with:
          auth: ${{ vars.CODE_REVIEW_AUTH || 'subscription' }}
          # Max: general-environments' benchmark-chosen model at Codex's `max` effort
          # (accepted by the pinned Codex 0.161.0, checked 2026-10-21).
          model: ${{ vars.CODE_REVIEW_MODEL || 'gpt-6-luna' }}
          effort: ${{ vars.CODE_REVIEW_EFFORT || 'max' }}
          codex-auth-json-b64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ github.token }}
